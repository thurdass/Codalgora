name: Validate Java desktop
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
        if: runner.os == 'Linux'
      - run: xvfb-run -a ./gradlew build --no-daemon
        if: runner.os == 'Linux'
      - run: .\gradlew.bat build --no-daemon
        if: runner.os == 'Windows'
      - name: Ensure WiX 3 for JDK 21 jpackage
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (!$wixBin) {
            choco install wixtoolset --version=3.14.1 --yes --no-progress
            $wixBin = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin\candle.exe" | Select-Object -First 1
          }
          $wixBin.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: ./gradlew :desktop:jpackageInstaller --no-daemon
        if: runner.os == 'Linux'
      - run: .\gradlew.bat :desktop:jpackageInstaller --no-daemon
        if: runner.os == 'Windows'
      - run: xvfb-run -a ./gradlew :desktop:jpackageSmokeTest --no-daemon
        if: runner.os == 'Linux'
      - run: .\gradlew.bat :desktop:jpackageSmokeTest --no-daemon
        if: runner.os == 'Windows'
      - name: Verify Linux window and desktop launcher identity
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y x11-utils
          xvfb-run -a python3 desktop/packaging/tests/verify-linux-desktop.py
      - name: Install, launch and uninstall Linux package
        if: runner.os == 'Linux'
        run: xvfb-run -a bash desktop/packaging/tests/verify-linux-package-install.sh
      - name: Install, launch and uninstall Windows package
        timeout-minutes: 5
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $failures = @()
          foreach ($installer in Get-ChildItem desktop/build/jpackage/installer/* | Where-Object Extension -in '.exe', '.msi') {
            powershell.exe -NoProfile -File ./desktop/packaging/tests/verify-windows-installer-ui.ps1 -InstallerPath $installer.FullName
            if ($LASTEXITCODE -ne 0) {
              $failures += "Installer UI test failed: $($installer.Name)"
              continue
            }
            ./desktop/packaging/tests/verify-windows-installer.ps1 -InstallerPath $installer.FullName
          }
          if ($failures.Count) { throw ($failures -join '; ') }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate SHA-256 checksums
        run: python desktop/packaging/create-checksums.py desktop/build/jpackage/installer
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: Windows-installer-diagnostics
          path: desktop/build/reports/installer/
      - uses: actions/upload-artifact@v4
        with:
          name: Codalgora-Java21-${{ runner.os }}
          path: desktop/build/jpackage/installer/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JUnit-reports-${{ runner.os }}
          path: '**/build/reports/tests/'
  publish-release:
    if: github.ref == 'refs/tags/v0.2.1'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Codalgora-Java21-*
          path: release-assets
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Confirm all platform installers are present
        run: |
          python - <<'PY'
          from pathlib import Path

          assets = Path('release-assets')
          for pattern in ('codalgora_*_amd64.deb', 'Codalgora-*.exe', 'Codalgora-*.msi'):
              matches = list(assets.glob(pattern))
              if len(matches) != 1:
                  raise SystemExit(f'Expected one {pattern}, found {len(matches)}')
          PY
      - name: Create and verify combined SHA-256 checksums
        run: |
          python desktop/packaging/create-checksums.py release-assets
          cd release-assets
          sha256sum -c SHA256SUMS.txt
      - name: Publish Codalgora v0.2.1
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > release-notes.md <<'EOF'
          Codalgora v0.2.1 conclui a migração de identidade de Algora para Codalgora e oferece instaladores nativos para Linux e Windows.

          - IDE educacional para escrever, executar e depurar algoritmos em Portugol.
          - Pacote Debian x64 e instaladores Windows x64 MSI e EXE, gerados nos runners correspondentes.
          - Testes, instalação, inicialização, atalhos e desinstalação validados no CI.
          - Os instaladores preservam os arquivos `.alg`, a sintaxe VisualG e o caminho legado de preferências `/io/algora/desktop`.
          - `SHA256SUMS.txt` contém os checksums SHA-256 de todos os instaladores desta release.

          A release histórica Algora v0.2.0 permanece disponível sem alterações.
          EOF
          gh release create "$TAG" --draft --verify-tag \
            --title "Codalgora v0.2.1 — Windows e Linux" \
            --notes-file release-notes.md
          gh release upload "$TAG" release-assets/*
          expected_assets="$(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)"
          actual_assets="$(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)"
          if [[ "$expected_assets" != "$actual_assets" ]]; then
            echo 'Uploaded release assets do not match the validated files.' >&2
            exit 1
          fi
          gh release edit "$TAG" --draft=false
